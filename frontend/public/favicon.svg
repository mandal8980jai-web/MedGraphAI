<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Base Background -->
  <path d="M24 4L7 11V22C7 32.5 14.3 42.1 24 44.5C33.7 42.1 41 32.5 41 22V11L24 4Z" 
        fill="url(#shieldGrad)" 
        filter="url(#shadow)" />

  <!-- Inner Subtle Border -->
  <path d="M24 6.5L9.5 12.5V22C9.5 31.2 15.8 39.8 24 42C32.2 39.8 38.5 31.2 38.5 22V12.5L24 6.5Z" 
        stroke="rgba(255,255,255,0.2)" 
        stroke-width="1" />

  <!-- Graph Connection Lines (Knowledge Graph Web) -->
  <g stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.5" stroke-linecap="round">
    <line x1="24" y1="15" x2="16" y2="21" />
    <line x1="24" y1="15" x2="32" y2="21" />
    <line x1="16" y1="21" x2="18" y2="31" />
    <line x1="32" y1="21" x2="30" y2="31" />
    <line x1="18" y1="31" x2="24" y2="34" />
    <line x1="30" y1="31" x2="24" y2="34" />
    <line x1="24" y1="15" x2="24" y2="34" stroke-dasharray="2 2" stroke="rgba(255,255,255,0.3)" />
  </g>

  <!-- Center Medical Cross with Rounded Corners -->
  <g filter="url(#shadow)">
    <!-- Vertical Cross Bar -->
    <rect x="21.5" y="18" width="5" height="12" rx="2" fill="url(#crossGrad)" />
    <!-- Horizontal Cross Bar -->
    <rect x="18" y="21.5" width="12" height="5" rx="2" fill="url(#crossGrad)" />
  </g>

  <!-- Graph Nodes (Circles with glow) -->
  <circle cx="24" cy="15" r="3" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="16" cy="21" r="2.5" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="32" cy="21" r="2.5" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="18" cy="31" r="2.5" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="30" cy="31" r="2.5" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="24" cy="34" r="3" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="1.2" />

  <!-- Center Pulse Dot -->
  <circle cx="24" cy="24" r="1.8" fill="#0284c7" />
</svg>
